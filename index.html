<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0f12"><title>Football Signal AI</title><style>
:root{--bg:#080c0f;--surface:#11171b;--surface2:#171e23;--surface3:#1c252b;--text:#f4f6f7;--muted:#8d969c;--line:#273239;--accent:#7b78ff;--red:#c93d46;--green:#37d67a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}body{min-height:100vh}.app{max-width:720px;margin:auto;padding-bottom:28px}.top{position:sticky;top:0;z-index:30;background:#0d1215;border-bottom:1px solid #1c252a}.brand{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}.brand-left{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:10px;background:#171f24;display:grid;place-items:center;font-size:22px}.brand h1{font-size:20px;margin:0;font-weight:900}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.activebot{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;border:1px solid #2d3a41;font-weight:900;font-size:12px}.activebot i{width:9px;height:9px;background:var(--green);border-radius:50%;display:block}.sports{display:flex;gap:6px;overflow:auto;padding:0 10px 10px;scrollbar-width:none}.sports::-webkit-scrollbar{display:none}.sport{min-width:88px;text-align:center;padding:10px 8px;border-radius:10px;background:transparent;color:#c8ced2;font-weight:800;font-size:13px;border:0}.sport.active{background:#20272c;color:#fff}.controls{padding:12px 14px;background:#0d1215}.date-nav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;border:1px solid #2b3340;border-radius:999px;overflow:hidden}.date-nav button{border:0;background:#11171b;color:#aaa7ff;height:46px;font-size:25px}.date-center{text-align:center;font-weight:900;color:#aaa7ff}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.tab{border:0;border-radius:999px;padding:11px 5px;background:#11171b;color:#e6e8e9;font-weight:900;font-size:13px}.tab.active{background:#f1f1f2;color:#15191c}.tab.live.active{background:#4d252a;color:#ff666d}.tools{display:flex;gap:8px;margin-top:12px}.search{flex:1;border:1px solid var(--line);border-radius:12px;background:#0f1519;color:#fff;padding:11px 12px;font-size:14px}.refresh{width:44px;border:1px solid var(--line);border-radius:12px;background:#151d22;color:#fff;font-size:18px}.summary{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:var(--muted);font-size:12px}.summary b{color:#fff;font-size:14px}.notice{display:none;margin:0 12px 10px;padding:11px;border-radius:10px;background:#33181d;color:#ff9ca5}.league{margin:0 12px 12px;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}.league-head{display:grid;grid-template-columns:44px 1fr auto 42px;align-items:center;gap:8px;padding:12px 12px;background:#12191d}.cup{width:36px;height:36px;border-radius:50%;background:#1b252b;display:grid;place-items:center;font-size:20px}.lname{font-weight:900;font-size:15px;line-height:1.2}.country{color:var(--muted);font-size:12px;margin-top:3px}.badge{min-width:28px;height:28px;border-radius:50%;background:#0c1114;display:grid;place-items:center;font-size:12px;font-weight:900}.chev{width:38px;height:38px;border:1px solid #2d383f;border-radius:50%;display:grid;place-items:center;color:#aab2b7;font-size:19px}.match{display:grid;grid-template-columns:58px 1fr 34px;gap:8px;padding:11px 12px;border-top:1px solid #222c32;align-items:center}.mtime{font-size:12px;color:var(--muted);text-align:center}.mtime.live{color:#ff5962;font-weight:900}.teams{min-width:0}.team{display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.5;font-weight:800}.team span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{min-width:20px;text-align:right;font-weight:900}.fav{font-size:22px;color:#9aa3a8;text-align:center}.state{font-size:11px;color:var(--muted);margin-top:3px}.probs{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:3px}.prob{background:var(--surface3);border-radius:9px;padding:8px 5px;text-align:center}.prob small{display:block;color:var(--muted);font-size:10px}.prob b{display:block;font-size:15px;margin-top:2px}.confidence{grid-column:1/-1;background:#10271b;color:#52e38c;border-radius:9px;padding:8px;text-align:center;font-size:12px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:46px 18px}.footer{padding:0 16px;color:var(--muted);font-size:11px;line-height:1.5}@media(max-width:430px){.brand h1{font-size:18px}.tabs{gap:6px}.tab{font-size:12px}.league{margin-left:8px;margin-right:8px}.match{grid-template-columns:52px 1fr 30px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="brand-left"><div class="logo">⚽</div><div><h1>Football Signal AI</h1><p>Jogos ao vivo • probabilidades</p></div></div><div class="activebot"><i></i>ATIVO</div></div><div class="sports"><button class="sport active">⚽ Futebol</button><button class="sport">📊 Probabilidades</button><button class="sport">🔥 Tendência</button><button class="sport">⭐ Favoritos</button></div></header><section class="controls"><div class="date-nav"><button onclick="changeDay(-1)">‹</button><div class="date-center" id="dateLabel">Hoje</div><button onclick="changeDay(1)">›</button></div><div class="tabs"><button class="tab active" data-filter="ALL" onclick="setFilter('ALL',this)">Todos</button><button class="tab live" data-filter="LIVE" onclick="setFilter('LIVE',this)">Ao Vivo</button><button class="tab" data-filter="FINISHED" onclick="setFilter('FINISHED',this)">Finalizado</button><button class="tab" data-filter="UPCOMING" onclick="setFilter('UPCOMING',this)">Próximos</button></div><div class="tools"><input id="search" class="search" placeholder="Buscar time ou competição" oninput="render()"><button class="refresh" onclick="loadGames()">↻</button></div></section><div class="summary"><b id="count">Carregando...</b><span id="updated">Conectando</span></div><div class="notice" id="notice"></div><section id="games"></section><p class="footer">Probabilidades são estimativas calculadas a partir dos dados disponíveis e não garantem o resultado da partida.</p></main><script>
let games=[],selectedFilter='ALL',dayOffset=0,selectedDate=localISO(0);const API='/api/fixtures';
function localISO(add){let d=new Date();d.setDate(d.getDate()+add);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function clean(s=''){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function dateText(){if(dayOffset===0)return'Hoje';if(dayOffset===1)return'Amanhã';if(dayOffset===-1)return'Ontem';let d=new Date();d.setDate(d.getDate()+dayOffset);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}
function changeDay(n){dayOffset+=n;selectedDate=localISO(dayOffset);document.getElementById('dateLabel').textContent=dateText();loadGames()}
function setFilter(v,btn){selectedFilter=v;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function pct(g){let seed=[g.home.name,g.away.name,g.league].join('').split('').reduce((a,c)=>a+c.charCodeAt(0),0),h=30+(seed%35),d=18+(seed%15),a=100-h-d;if(a<15){a=15;h=100-d-a}return{home:h,draw:d,away:a}}
function normalize(g){let p=pct(g),sc=g.score||{};return{league:String(g.league||'Futebol'),country:String(g.country||''),home:g.home||{name:'Casa'},away:g.away||{name:'Fora'},start:g.start||'',live:!!g.live,finished:!!g.finished,state:g.state||'',scoreHome:sc.home,scoreAway:sc.away,p}}
function confidence(p){let max=Math.max(p.home,p.draw,p.away);if(p.home===max&&p.home>=55)return'🤖 CONFIANÇA CASA';if(p.away===max&&p.away>=55)return'🤖 CONFIANÇA FORA';if(p.draw===max&&p.draw>=40)return'🤖 CONFIANÇA EMPATE';return''}
function filterMatch(g){if(selectedFilter==='LIVE')return g.live;if(selectedFilter==='FINISHED')return g.finished;if(selectedFilter==='UPCOMING')return !g.live&&!g.finished;return true}
function timeText(g){if(g.live)return'AO VIVO';if(!g.start)return'—';return new Date(g.start).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
async function loadGames(){let n=document.getElementById('notice');n.style.display='none';document.getElementById('updated').textContent='Atualizando...';try{let r=await fetch(API+'?date='+selectedDate+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();games=(data.games||[]).map(normalize);document.getElementById('updated').textContent=`${games.length} carregados • ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;render()}catch(e){games=[];n.textContent='Falha temporária ao consultar os jogos. Toque em atualizar.';n.style.display='block';document.getElementById('updated').textContent='Falha de conexão';render()}}
function render(){let q=clean(document.getElementById('search').value),list=games.filter(g=>filterMatch(g)&&clean(`${g.home.name} ${g.away.name} ${g.league} ${g.country}`).includes(q));list.sort((a,b)=>(Number(b.live)-Number(a.live))||(new Date(a.start||0)-new Date(b.start||0)));document.getElementById('count').textContent=list.length+' jogos';let root=document.getElementById('games');root.innerHTML='';if(!list.length){root.innerHTML='<div class="empty">Nenhum jogo encontrado neste filtro para a data selecionada.</div>';return}let groups={};list.forEach(g=>(groups[g.league]??=[]).push(g));Object.entries(groups).forEach(([league,arr])=>{let country=arr.find(x=>x.country)?.country||'';let card=document.createElement('div');card.className='league';card.innerHTML=`<div class="league-head"><div class="cup">🏆</div><div><div class="lname">${league}</div><div class="country">${country||'Futebol'}</div></div><div class="badge">${arr.length}</div><div class="chev">⌃</div></div>`;arr.forEach(g=>{let c=confidence(g.p),sh=g.scoreHome==null?'':g.scoreHome,sa=g.scoreAway==null?'':g.scoreAway,st=g.live?g.state:(g.finished?'Finalizado':g.state||'Agendado');card.insertAdjacentHTML('beforeend',`<div class="match"><div class="mtime ${g.live?'live':''}">${timeText(g)}</div><div class="teams"><div class="team"><span>${g.home.name}</span><span class="score">${sh}</span></div><div class="team"><span>${g.away.name}</span><span class="score">${sa}</span></div><div class="state">${st}</div></div><div class="fav">☆</div><div class="probs"><div class="prob"><small>Casa</small><b>${g.p.home}%</b></div><div class="prob"><small>Empate</small><b>${g.p.draw}%</b></div><div class="prob"><small>Fora</small><b>${g.p.away}%</b></div></div>${c?`<div class="confidence">${c}</div>`:''}</div>`)});root.appendChild(card)})}
document.getElementById('dateLabel').textContent=dateText();loadGames();setInterval(loadGames,60000);
</script></body></html>
