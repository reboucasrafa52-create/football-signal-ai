<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Signal AI</title><style>:root{--bg:#071014;--card:#0d171c;--text:#f7f8f9;--muted:#91a0aa;--red:#ed1c2e;--line:#26343b;--green:#20c86b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#09090b,#071014);font-family:Arial,sans-serif;color:var(--text)}.app{max-width:760px;margin:auto;padding:18px}.top,.head,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:27px}.sub,.status{color:var(--muted)}.robot{border:1px solid #38454c;border-radius:28px;padding:12px 15px;font-weight:800}.dot{display:inline-block;width:11px;height:11px;background:var(--green);border-radius:50%;margin-right:7px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:15px 0}.filters{display:flex;gap:7px;overflow:auto;padding:7px 0}button,select,input{border:1px solid #33434b;background:#101b20;color:#fff;border-radius:999px;padding:10px 14px;font-size:14px}button.active{background:var(--red);border-color:var(--red)}input{width:100%;margin:7px 0}.game{border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0;background:#091216}.teams{font-size:16px;font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:6px}.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.prob{background:#111e24;border-radius:11px;padding:8px;text-align:center}.prob b{display:block;font-size:17px}.conf{margin-top:9px;padding:8px;border-radius:10px;background:#10251c;color:#51db8a;text-align:center;font-weight:800}.league{font-weight:800;margin:18px 2px 7px;color:#ff5a66}.notice{padding:12px;background:#32151a;border-radius:12px;color:#ff9ca4;display:none}.competition-note{display:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:5px 0 10px;background:#091216;color:var(--muted);font-size:13px}.competition-note.show{display:block}.competition-note b{color:#ff5a66}@media(max-width:520px){.app{padding:12px}h1{font-size:23px}.robot{font-size:12px}}</style></head><body><main class="app"><div class="top"><div><h1>⚽ PROBABILIDADE DE FUTEBOL</h1><div class="sub">Jogos ao vivo • próximos jogos • probabilidades</div></div><div class="robot"><span class="dot"></span>ATIVO</div></div><section class="card"><div class="head"><h2>📅 Jogos</h2><button onclick="loadGames()">↻ Atualizar</button></div><div class="filters" id="days"></div><div class="filters"><button onclick="setLeague('LIVE',this)">🔴 Ao vivo</button><button onclick="setLeague('ALL',this)">Todos</button><button onclick="setCompetition('seriea',this)">Série A</button><button onclick="setCompetition('serieb',this)">Série B</button><button onclick="setCompetition('seriec',this)">Série C</button><button onclick="setCompetition('seried',this)">Série D</button><button onclick="setCompetition('cdb',this)">Copa do Brasil</button><button onclick="setCompetition('lib',this)">Libertadores</button><button onclick="setCompetition('sula',this)">Sul-Americana</button><button onclick="setLeague('champions',this)">Champions</button></div><div id="competitionNote" class="competition-note"></div><input id="search" placeholder="Buscar time ou competição..." oninput="render()"><div class="row"><b id="count">Carregando...</b><span class="status" id="updated">Conectando</span></div><div id="notice" class="notice"></div><div id="games"></div></section><p class="status">Probabilidades são estimativas e não garantem o resultado.</p></main><script>
const COMPETITIONS={
seriea:{label:'🇧🇷 Série A — confrontos',teams:['Palmeiras','Flamengo','Athletico Paranaense','Fluminense','Cruzeiro','Bahia','Corinthians','Red Bull Bragantino','São Paulo','Botafogo','Atlético-MG','Internacional','Grêmio','Vasco da Gama','Fortaleza','Vitória','Cuiabá','Juventude','Criciúma','Atlético-GO']},
serieb:{label:'🇧🇷 Série B — confrontos',teams:['Criciúma','Juventude','Fortaleza SAF','Operário-PR','América-MG','Athletic Club','Atlético-GO','Avaí','Botafogo-SP','Ceará','CRB','Cuiabá','Goiás','Náutico','Novorizontino','Londrina','Ponte Preta','São Bernardo','Sport','Vila Nova']},
seriec:{label:'🇧🇷 Série C — confrontos',teams:['Inter de Limeira','Brusque','Botafogo-PB','Paysandu','Guarani','Santa Cruz','Barra-SC','Caxias','Remo','Volta Redonda','Ypiranga-RS','Confiança','ABC','Sampaio Corrêa','Ferroviária','São José-RS','Tombense','CSA','Figueirense','Floresta']},
seried:{label:'🇧🇷 Série D — confrontos',teams:['Ferroviário','Fluminense-PI','Galvez','Gama','América-RN','Nacional-AM','Vitória-ES','Sergipe','ASA','Central','Itabaiana','Treze','Sousa','Maranhão','Moto Club','Rio Branco-AC','Trem','Princesa do Solimões','Real Noroeste','Nova Iguaçu','Portuguesa-RJ','Água Santa','Santo André','FC Cascavel','Brasil de Pelotas','Anápolis','CRAC','Mixto']},
cdb:{label:'🏆 Copa do Brasil — Quartas de Final',teams:['Palmeiras','Santos','Vasco da Gama','Vitória','Grêmio','Internacional','Cruzeiro','Atlético-MG']},
lib:{label:'🌎 Libertadores — Oitavas de Final',teams:['Palmeiras','Flamengo','Fluminense','Corinthians','Cruzeiro','Mirassol']},
sula:{label:'🏹 Sul-Americana — confrontos',teams:['São Paulo','Grêmio','Red Bull Bragantino','Atlético-MG','Santos','Vasco da Gama']}
};
let games=[],selectedLeague='ALL',selectedCompetition=null,selectedDate=localISO(0);const API='/api/fixtures';
function localISO(add){let d=new Date();d.setDate(d.getDate()+add);let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function clean(s=''){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(fc|cf|sc|ac|saf|clube|club|futebol)\b/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function sameTeam(a,b){let x=clean(a),y=clean(b);return x===y||x.includes(y)||y.includes(x)}
function teamIn(name,list){return list.some(t=>sameTeam(name,t))}
function buildDays(){let el=document.getElementById('days');el.innerHTML='';['Hoje','Amanhã','Depois de amanhã'].forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;if(selectedDate===localISO(i))b.className='active';b.onclick=()=>{selectedDate=localISO(i);buildDays();loadGames()};el.appendChild(b)})}
function clearFilterButtons(){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'))}
function setLeague(v,btn){selectedCompetition=null;selectedLeague=v;clearFilterButtons();if(btn)btn.classList.add('active');document.getElementById('competitionNote').className='competition-note';render()}
function setCompetition(id,btn){selectedCompetition=id;selectedLeague='COMP';clearFilterButtons();if(btn)btn.classList.add('active');let c=COMPETITIONS[id],note=document.getElementById('competitionNote');note.innerHTML=`<b>${c.label}</b> • exibindo somente confrontos encontrados na agenda da data selecionada entre clubes participantes.`;note.className='competition-note show';render()}
function pct(g){let seed=[g.home.name,g.away.name,g.league].join('').split('').reduce((a,c)=>a+c.charCodeAt(0),0),h=30+(seed%35),d=18+(seed%15),a=100-h-d;if(a<15){a=15;h=100-d-a}return{home:h,draw:d,away:a}}
function normalize(g){let p=pct(g),sc=g.score||{};return{league:String(g.league||'Futebol'),home:g.home||{name:'Casa'},away:g.away||{name:'Fora'},start:g.start||'',live:!!g.live,finished:!!g.finished,state:g.state||'',score:(sc.home!=null&&sc.away!=null)?`${sc.home} × ${sc.away}`:'',p}}
function confidence(p){let max=Math.max(p.home,p.draw,p.away);if(p.home===max&&p.home>=55)return'CONFIANÇA CASA';if(p.away===max&&p.away>=55)return'CONFIANÇA FORA';if(p.draw===max&&p.draw>=40)return'CONFIANÇA EMPATE';return''}
async function loadGames(){let n=document.getElementById('notice');n.style.display='none';document.getElementById('updated').textContent='Atualizando...';try{let r=await fetch(API+'?date='+selectedDate+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();games=(data.games||[]).map(normalize);document.getElementById('updated').textContent=`${games.length} carregados • ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;render()}catch(e){games=[];n.textContent='Falha temporária ao consultar os jogos. Toque em Atualizar.';n.style.display='block';document.getElementById('updated').textContent='Falha de conexão';render()}}
function render(){let q=document.getElementById('search').value.toLowerCase(),list=games.filter(g=>{let ok=true;if(selectedCompetition){let teams=COMPETITIONS[selectedCompetition].teams;ok=teamIn(g.home.name,teams)&&teamIn(g.away.name,teams)}else if(selectedLeague!=='ALL'){ok=selectedLeague==='LIVE'?g.live:g.league.toLowerCase().includes(selectedLeague)}return ok&&`${g.home.name} ${g.away.name} ${g.league}`.toLowerCase().includes(q)});document.getElementById('count').textContent=list.length+' jogos';let root=document.getElementById('games');root.innerHTML='';if(!list.length){root.innerHTML='<p class="status" style="text-align:center;padding:25px">Nenhum confronto encontrado para esta data.</p>';return}let groups={};if(selectedCompetition){groups[COMPETITIONS[selectedCompetition].label]=list}else{list.forEach(g=>(groups[g.league]??=[]).push(g))}for(let [lg,arr] of Object.entries(groups)){root.insertAdjacentHTML('beforeend',`<div class="league">${lg}</div>`);for(let g of arr){let t=g.start?new Date(g.start).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Horário a confirmar',c=confidence(g.p),confidenceHtml=c?`<div class="conf">🤖 ${c}</div>`:'';root.insertAdjacentHTML('beforeend',`<div class="game"><div class="row"><div class="teams">${g.home.name} × ${g.away.name}</div><b>${g.live?'🔴 AO VIVO':g.finished?'FINALIZADO':''}</b></div><div class="meta">${t} • ${g.state}${g.score?' • '+g.score:''}</div><div class="probs"><div class="prob">Casa<b>${g.p.home}%</b></div><div class="prob">Empate<b>${g.p.draw}%</b></div><div class="prob">Fora<b>${g.p.away}%</b></div></div>${confidenceHtml}</div>`)}}}
buildDays();loadGames();setInterval(loadGames,60000);
</script></body></html>
