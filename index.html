<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11171b"><title>Football Signal AI</title><style>
:root{--bg:#090d10;--top:#11171b;--panel:#171d21;--panel2:#20272c;--panel3:#252d33;--text:#f5f6f7;--muted:#979fa5;--line:#2d363c;--accent:#7874ff;--live:#9d2f38;--green:#39d67d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}body{min-height:100vh}.app{max-width:720px;margin:auto;padding-bottom:82px}.header{position:sticky;top:0;z-index:20;background:var(--top);border-bottom:1px solid #242c31}.brand{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand-left{display:flex;align-items:center;gap:10px}.mark{font-size:28px}.brand-title{font-size:22px;font-weight:900}.bot{font-size:12px;font-weight:900;border:1px solid #364149;border-radius:999px;padding:8px 11px}.bot i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:6px}.sports{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid #171e22}.sports::-webkit-scrollbar{display:none}.sport{min-width:118px;height:82px;border:0;background:transparent;color:#d9dddf;font-weight:800;font-size:14px;padding:10px}.sport.active{background:#20262b;border-bottom:3px solid #aaa7ff}.sport .ico{display:block;font-size:25px;margin-bottom:6px}.date-section{background:#11171b;padding:14px 16px 12px}.date-row{display:grid;grid-template-columns:44px 1fr 44px auto;align-items:center;gap:8px}.arrow{height:48px;border:0;background:#151b20;color:#8b86ff;font-size:28px}.datebox{height:48px;display:grid;place-items:center;border:1px solid #303744;background:#151b20;color:#9d98ff;font-weight:900}.datebox,.arrow:first-child{border-radius:999px 0 0 999px}.arrow:nth-child(3){border-radius:0 999px 999px 0}.prob-toggle{display:flex;align-items:center;gap:8px;font-weight:900;padding-left:8px}.switch{width:44px;height:24px;border-radius:999px;background:#4f5357;position:relative}.switch:after{content:'';position:absolute;right:1px;top:1px;width:22px;height:22px;border-radius:50%;background:#7f7aff}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.tab{border:0;border-radius:999px;background:#0d1215;color:#fff;padding:12px 5px;font-size:13px;font-weight:900}.tab.active{background:#eceeef;color:#171b1e}.tab.live.active{background:#51262b;color:#ff656d}.intro{padding:12px 16px;color:#9aa1a6;font-size:15px;font-weight:700}.tools{display:flex;gap:8px;padding:0 16px 12px}.search{flex:1;border:1px solid var(--line);background:#10161a;color:#fff;border-radius:12px;padding:11px 12px}.refresh{width:46px;border:1px solid var(--line);background:#171e23;color:#fff;border-radius:12px;font-size:18px}.summary{display:flex;justify-content:space-between;padding:0 16px 12px;color:var(--muted);font-size:12px}.summary b{color:#fff}.notice{display:none;margin:0 14px 10px;padding:10px;border-radius:10px;background:#34181d;color:#ff9ca5}.league{margin:0 14px 12px;background:var(--panel);border-radius:18px;overflow:hidden;border:1px solid #2b343a}.league-head{display:grid;grid-template-columns:48px 1fr 30px 42px;align-items:center;gap:9px;padding:13px;background:#1b2227}.league-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#262f35;font-size:21px}.lname{font-size:15px;font-weight:900}.country{font-size:12px;color:var(--muted);margin-top:3px}.badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#101518;font-size:12px;font-weight:900}.collapse{width:38px;height:38px;border:1px solid #374148;border-radius:50%;display:grid;place-items:center;color:#b6bdc1;font-size:19px}.match{display:grid;grid-template-columns:60px 1fr 36px;gap:8px;align-items:center;padding:11px 13px;border-top:1px solid #273137}.mtime{font-size:12px;color:var(--muted);text-align:center}.mtime.live{color:#ff636c;font-weight:900}.teams{min-width:0}.team{display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.5;font-weight:800}.team-left{display:flex;align-items:center;min-width:0;gap:7px}.team-left img{width:20px;height:20px;object-fit:contain}.team-left span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-weight:900}.fav{font-size:24px;text-align:center;color:#9da5aa}.state{font-size:10px;color:var(--muted);margin-top:3px}.probs{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:3px}.prob{background:#0f1417;border-radius:9px;padding:7px 5px;text-align:center}.prob small{display:block;color:var(--muted);font-size:10px}.prob b{display:block;font-size:14px;margin-top:2px}.confidence{grid-column:1/-1;background:#10271b;color:#55e48f;border-radius:9px;padding:8px;text-align:center;font-size:12px;font-weight:900}.empty{padding:46px 18px;text-align:center;color:var(--muted)}.footer-note{padding:0 16px 14px;color:var(--muted);font-size:11px}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(720px,100%);height:72px;background:#1b2227;border-top:1px solid #2b343a;display:grid;grid-template-columns:repeat(5,1fr)}.nav{display:grid;place-items:center;color:#d6dadd;font-size:11px;font-weight:800}.nav span{display:block;font-size:23px;margin-bottom:3px}.nav.active{color:#8f89ff;border-bottom:3px solid #8f89ff}@media(max-width:430px){.brand-title{font-size:20px}.sport{min-width:104px}.prob-toggle{font-size:13px}.league{margin-left:8px;margin-right:8px}}
</style></head><body><main class="app"><header class="header"><div class="brand"><div class="brand-left"><div class="mark">⚽</div><div class="brand-title">Football Signal AI</div></div><div class="bot"><i></i>ATIVO</div></div><div class="sports"><button class="sport">🔥<span class="ico">📈</span>Em Tendência</button><button class="sport active"><span class="ico">⚽</span>Futebol</button><button class="sport"><span class="ico">🏐</span>Vôlei</button><button class="sport"><span class="ico">🏀</span>Basquete</button><button class="sport"><span class="ico">🎾</span>Tênis</button></div></header><section class="date-section"><div class="date-row"><button class="arrow" onclick="changeDay(-1)">‹</button><div class="datebox" id="dateLabel">Hoje</div><button class="arrow" onclick="changeDay(1)">›</button><div class="prob-toggle">Probabilidades <span class="switch"></span></div></div><div class="tabs"><button class="tab active" onclick="setFilter('ALL',this)">Todos</button><button class="tab live" onclick="setFilter('LIVE',this)">Ao Vivo</button><button class="tab" onclick="setFilter('FINISHED',this)">Finalizado</button><button class="tab" onclick="setFilter('UPCOMING',this)">Próximos</button></div></section><div class="intro">Jogos de futebol de hoje e resultados ao vivo</div><div class="tools"><input id="search" class="search" placeholder="Buscar time ou competição" oninput="render()"><button class="refresh" onclick="loadGames()">↻</button></div><div class="summary"><b id="count">Carregando...</b><span id="updated">Conectando</span></div><div class="notice" id="notice"></div><section id="games"></section><p class="footer-note">Probabilidades são estimativas e não garantem o resultado.</p></main><nav class="bottom"><div class="nav active"><div><span>🕒</span>Partidas</div></div><div class="nav"><div><span>🔎</span>Pesquisa</div></div><div class="nav"><div><span>📊</span>Análises</div></div><div class="nav"><div><span>☆</span>Favoritos</div></div><div class="nav"><div><span>👤</span>Perfil</div></div></nav><script>
let games=[],selectedFilter='ALL',dayOffset=0,selectedDate=localISO(0);const API='/api/fixtures';
function localISO(add){let d=new Date();d.setDate(d.getDate()+add);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function clean(s=''){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function dateText(){if(dayOffset===0)return'Hoje';if(dayOffset===1)return'Amanhã';if(dayOffset===-1)return'Ontem';let d=new Date();d.setDate(d.getDate()+dayOffset);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}
function changeDay(n){dayOffset+=n;selectedDate=localISO(dayOffset);document.getElementById('dateLabel').textContent=dateText();loadGames()}
function setFilter(v,btn){selectedFilter=v;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function pct(g){let seed=[g.home.name,g.away.name,g.league].join('').split('').reduce((a,c)=>a+c.charCodeAt(0),0),h=30+(seed%35),d=18+(seed%15),a=100-h-d;if(a<15){a=15;h=100-d-a}return{home:h,draw:d,away:a}}
function normalize(g){let p=pct(g),sc=g.score||{};return{league:String(g.league||'Futebol'),country:String(g.country||''),home:g.home||{name:'Casa'},away:g.away||{name:'Fora'},start:g.start||'',live:!!g.live,finished:!!g.finished,state:g.state||'',scoreHome:sc.home,scoreAway:sc.away,p}}
function confidence(p){let max=Math.max(p.home,p.draw,p.away);if(p.home===max&&p.home>=55)return'🤖 CONFIANÇA CASA';if(p.away===max&&p.away>=55)return'🤖 CONFIANÇA FORA';if(p.draw===max&&p.draw>=40)return'🤖 CONFIANÇA EMPATE';return''}
function filterMatch(g){if(selectedFilter==='LIVE')return g.live;if(selectedFilter==='FINISHED')return g.finished;if(selectedFilter==='UPCOMING')return !g.live&&!g.finished;return true}
function timeText(g){if(g.live)return'AO VIVO';if(!g.start)return'—';return new Date(g.start).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function teamLogo(t){return t&&t.logo?`<img src="${t.logo}" alt="">`:'⚽'}
async function loadGames(){let n=document.getElementById('notice');n.style.display='none';document.getElementById('updated').textContent='Atualizando...';try{let r=await fetch(API+'?date='+selectedDate+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();games=(data.games||[]).map(normalize);document.getElementById('updated').textContent=`${games.length} carregados • ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;render()}catch(e){games=[];n.textContent='Falha temporária ao consultar os jogos. Toque em atualizar.';n.style.display='block';document.getElementById('updated').textContent='Falha de conexão';render()}}
function render(){let q=clean(document.getElementById('search').value),list=games.filter(g=>filterMatch(g)&&clean(`${g.home.name} ${g.away.name} ${g.league} ${g.country}`).includes(q));list.sort((a,b)=>(Number(b.live)-Number(a.live))||(new Date(a.start||0)-new Date(b.start||0)));document.getElementById('count').textContent=list.length+' jogos';let root=document.getElementById('games');root.innerHTML='';if(!list.length){root.innerHTML='<div class="empty">Nenhum jogo encontrado neste filtro para a data selecionada.</div>';return}let groups={};list.forEach(g=>(groups[g.league]??=[]).push(g));Object.entries(groups).forEach(([league,arr])=>{let country=arr.find(x=>x.country)?.country||'Futebol';let card=document.createElement('div');card.className='league';card.innerHTML=`<div class="league-head"><div class="league-icon">🏆</div><div><div class="lname">${league}</div><div class="country">${country}</div></div><div class="badge">${arr.length}</div><div class="collapse">⌃</div></div>`;arr.forEach(g=>{let c=confidence(g.p),sh=g.scoreHome==null?'':g.scoreHome,sa=g.scoreAway==null?'':g.scoreAway,st=g.live?g.state:(g.finished?'Finalizado':g.state||'Agendado');card.insertAdjacentHTML('beforeend',`<div class="match"><div class="mtime ${g.live?'live':''}">${timeText(g)}</div><div class="teams"><div class="team"><div class="team-left">${teamLogo(g.home)}<span>${g.home.name}</span></div><span class="score">${sh}</span></div><div class="team"><div class="team-left">${teamLogo(g.away)}<span>${g.away.name}</span></div><span class="score">${sa}</span></div><div class="state">${st}</div></div><div class="fav">☆</div><div class="probs"><div class="prob"><small>Casa</small><b>${g.p.home}%</b></div><div class="prob"><small>Empate</small><b>${g.p.draw}%</b></div><div class="prob"><small>Fora</small><b>${g.p.away}%</b></div></div>${c?`<div class="confidence">${c}</div>`:''}</div>`)});root.appendChild(card)})}
document.getElementById('dateLabel').textContent=dateText();loadGames();setInterval(loadGames,60000);
</script></body></html>
