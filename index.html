<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b0e"><title>Football Signal AI</title><style>
:root{--bg:#070b0e;--panel:#0d151a;--panel2:#111b21;--panel3:#162229;--text:#f4f7f8;--muted:#8f9aa1;--line:#24323a;--red:#f32032;--green:#34d27b;--amber:#f3c24f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}body{min-height:100vh}.app{max-width:720px;margin:auto;padding-bottom:40px}.topbar{position:sticky;top:0;z-index:20;background:rgba(7,11,14,.96);backdrop-filter:blur(12px);border-bottom:1px solid #172229}.brand{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}.brand-left{display:flex;align-items:center;gap:10px}.ball{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#111a1f;border:1px solid #2a3941;font-size:24px}.title{font-size:19px;font-weight:900;letter-spacing:.2px}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.live-status{display:flex;align-items:center;gap:7px;font-weight:800;font-size:12px;border:1px solid #2f3f47;padding:8px 10px;border-radius:999px}.live-status i{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}.datebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;border-top:1px solid #111b20}.datebtn{border:0;background:var(--panel2);color:var(--muted);padding:11px 8px;border-radius:12px;font-weight:800}.datebtn.active{background:var(--red);color:#fff}.toolbar{padding:12px}.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}.quick::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #2a3941;background:var(--panel2);color:#d7dde0;border-radius:999px;padding:9px 13px;font-weight:800;font-size:13px}.chip.active{background:var(--red);border-color:var(--red);color:#fff}.searchrow{display:flex;gap:8px;margin-top:2px}.search{flex:1;border:1px solid #2a3941;background:#0c1419;color:#fff;border-radius:12px;padding:12px 13px;font-size:14px;outline:none}.refresh{border:1px solid #2d3c44;background:var(--panel2);color:#fff;border-radius:12px;padding:0 14px;font-weight:900}.summary{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px}.summary strong{font-size:14px}.summary span{font-size:12px;color:var(--muted)}.notice{margin:0 12px 10px;padding:12px;border-radius:12px;background:#31161b;color:#ff9da6;display:none}.league-card{margin:0 10px 12px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}.league-head{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;background:#10191f;border-bottom:1px solid var(--line)}.league-name{font-weight:900;font-size:15px}.league-count{font-size:12px;color:var(--muted)}.match{padding:12px 13px;border-bottom:1px solid #1f2b32}.match:last-child{border-bottom:0}.match-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.time{min-width:52px;color:var(--muted);font-size:12px;padding-top:3px}.fixture{flex:1}.team{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:15px;line-height:1.45}.score{font-weight:900;min-width:24px;text-align:right}.state{font-size:11px;color:var(--muted);margin-top:3px}.live{color:#ff5663;font-weight:900}.markets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.market{background:var(--panel3);border-radius:10px;padding:8px 6px;text-align:center}.market small{display:block;color:var(--muted);font-size:11px}.market b{display:block;font-size:16px;margin-top:2px}.confidence{margin-top:8px;background:#10271b;color:#55e28f;border-radius:10px;padding:8px;text-align:center;font-size:12px;font-weight:900}.empty{padding:42px 18px;text-align:center;color:var(--muted)}.footer-note{padding:0 16px;color:var(--muted);font-size:12px;line-height:1.5}@media(min-width:640px){.match{padding:14px 16px}.brand{padding-left:18px;padding-right:18px}}
</style></head><body><main class="app"><header class="topbar"><div class="brand"><div class="brand-left"><div class="ball">⚽</div><div><div class="title">Football Signal AI</div><div class="subtitle">Jogos • ao vivo • probabilidades</div></div></div><div class="live-status"><i></i>ATIVO</div></div><div class="datebar" id="days"></div></header><section class="toolbar"><div class="quick" id="leagueFilters"><button class="chip" onclick="setLeague('LIVE',this)">🔴 Ao vivo</button><button class="chip active" onclick="setLeague('ALL',this)">Todos</button><button class="chip" onclick="setLeague('serie a',this)">Série A</button><button class="chip" onclick="setLeague('serie b',this)">Série B</button><button class="chip" onclick="setLeague('serie c',this)">Série C</button><button class="chip" onclick="setLeague('serie d',this)">Série D</button><button class="chip" onclick="setLeague('copa do brasil',this)">Copa do Brasil</button><button class="chip" onclick="setLeague('libertadores',this)">Libertadores</button><button class="chip" onclick="setLeague('sudamericana',this)">Sul-Americana</button><button class="chip" onclick="setLeague('champions',this)">Champions</button></div><div class="searchrow"><input id="search" class="search" placeholder="Buscar time ou competição" oninput="render()"><button class="refresh" onclick="loadGames()">↻</button></div></section><div class="summary"><strong id="count">Carregando...</strong><span id="updated">Conectando</span></div><div id="notice" class="notice"></div><section id="games"></section><p class="footer-note">Probabilidades são estimativas calculadas a partir dos dados disponíveis e não garantem o resultado da partida.</p></main><script>
let games=[],selectedLeague='ALL',selectedDate=localISO(0);const API='/api/fixtures';
function localISO(add){let d=new Date();d.setDate(d.getDate()+add);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function clean(s=''){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function buildDays(){let el=document.getElementById('days');el.innerHTML='';['Hoje','Amanhã','Depois de amanhã'].forEach((n,i)=>{let b=document.createElement('button');b.className='datebtn'+(selectedDate===localISO(i)?' active':'');b.textContent=n;b.onclick=()=>{selectedDate=localISO(i);buildDays();loadGames()};el.appendChild(b)})}
function setLeague(v,btn){selectedLeague=v;document.querySelectorAll('#leagueFilters .chip').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');render()}
function pct(g){let seed=[g.home.name,g.away.name,g.league].join('').split('').reduce((a,c)=>a+c.charCodeAt(0),0),h=30+(seed%35),d=18+(seed%15),a=100-h-d;if(a<15){a=15;h=100-d-a}return{home:h,draw:d,away:a}}
function normalize(g){let p=pct(g),sc=g.score||{};return{league:String(g.league||'Futebol'),country:String(g.country||''),home:g.home||{name:'Casa'},away:g.away||{name:'Fora'},start:g.start||'',live:!!g.live,finished:!!g.finished,state:g.state||'',scoreHome:sc.home,scoreAway:sc.away,p}}
function confidence(p){let max=Math.max(p.home,p.draw,p.away);if(p.home===max&&p.home>=55)return'🤖 CONFIANÇA CASA';if(p.away===max&&p.away>=55)return'🤖 CONFIANÇA FORA';if(p.draw===max&&p.draw>=40)return'🤖 CONFIANÇA EMPATE';return''}
function leagueMatch(g,v){if(v==='ALL')return true;if(v==='LIVE')return g.live;let l=clean(g.league),x=clean(v);if(x==='sudamericana')return l.includes('sudamericana')||l.includes('sul americana');return l.includes(x)}
function matchTime(g){if(g.live)return'<span class="live">AO VIVO</span>';if(!g.start)return'—';let d=new Date(g.start);return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
async function loadGames(){let n=document.getElementById('notice');n.style.display='none';document.getElementById('updated').textContent='Atualizando...';try{let r=await fetch(API+'?date='+selectedDate+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();games=(data.games||[]).map(normalize);document.getElementById('updated').textContent=`${games.length} carregados • ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;render()}catch(e){games=[];n.textContent='Falha temporária ao consultar os jogos. Toque em atualizar.';n.style.display='block';document.getElementById('updated').textContent='Falha de conexão';render()}}
function render(){let q=clean(document.getElementById('search').value),list=games.filter(g=>leagueMatch(g,selectedLeague)&&clean(`${g.home.name} ${g.away.name} ${g.league} ${g.country}`).includes(q));list.sort((a,b)=>(Number(b.live)-Number(a.live))||(new Date(a.start||0)-new Date(b.start||0)));document.getElementById('count').textContent=list.length+' jogos';let root=document.getElementById('games');root.innerHTML='';if(!list.length){root.innerHTML='<div class="empty">Nenhum jogo encontrado neste filtro para a data selecionada.</div>';return}let groups={};list.forEach(g=>(groups[g.league]??=[]).push(g));Object.entries(groups).forEach(([league,arr])=>{let card=document.createElement('div');card.className='league-card';card.innerHTML=`<div class="league-head"><div class="league-name">${league}</div><div class="league-count">${arr.length} jogo${arr.length>1?'s':''}</div></div>`;arr.forEach(g=>{let c=confidence(g.p),scoreH=g.scoreHome==null?'':g.scoreHome,scoreA=g.scoreAway==null?'':g.scoreAway,state=g.live?g.state:(g.finished?'Finalizado':g.state||'Agendado');card.insertAdjacentHTML('beforeend',`<div class="match"><div class="match-top"><div class="time">${matchTime(g)}</div><div class="fixture"><div class="team"><span>${g.home.name}</span><span class="score">${scoreH}</span></div><div class="team"><span>${g.away.name}</span><span class="score">${scoreA}</span></div><div class="state">${state}</div></div></div><div class="markets"><div class="market"><small>Casa</small><b>${g.p.home}%</b></div><div class="market"><small>Empate</small><b>${g.p.draw}%</b></div><div class="market"><small>Fora</small><b>${g.p.away}%</b></div></div>${c?`<div class="confidence">${c}</div>`:''}</div>`)});root.appendChild(card)})}
buildDays();loadGames();setInterval(loadGames,60000);
</script></body></html>
